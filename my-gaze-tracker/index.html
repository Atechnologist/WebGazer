<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobile Gaze Tracker - Modular Build</title>
    
    <!-- FIX 1: Restored your exact, working TensorFlow.js bundle script configurations -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-detection@1.0.2/dist/face-detection.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection@1.0.6/dist/face-landmarks-detection.min.js"></script> 

    <!-- Link Mapping to Separate Stylesheet Layout Modules -->
    <link rel="stylesheet" href="assets/css/style.css?v=exact_match">
    <link rel="icon" href="data:,">
</head>
<body>

    <div id="debug-console">System Log: Downloading core engine structures...</div>
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="heatmap-canvas"></canvas>
    <div id="calib-dot" class="calib-dot"></div>
    <div id="gaze-pointer"></div>

    <button id="settings-btn" onclick="toggleSettings()">⚙️ Settings</button>
    <div id="settings-panel">
        <div class="control-group">
            <label>Smoothing (Jitter Fix)</label>
            <input type="range" id="smooth-range" min="1" max="25" value="6" oninput="updateSettings()">
            <span id="smooth-val">6 frames</span>
        </div>
        <div class="control-group">
            <label>X-Axis Inversion</label>
            <input type="checkbox" id="invert-x-check" onchange="updateSettings()"> Invert Horizontal Map
        </div>
        <div class="control-group">
            <button onclick="clearHeatmap()" style="width:100%; background:#ff3366; color:white; margin-bottom:15px;">Clear Heatmap</button>
        </div>
        
        <!-- Embedded Relay target block element inside working menu layout -->
        <div class="control-group">
            <div id="relay-button-target">RELAY SWITCH [0%]</div>
        </div>
    </div>

    <div id="ui-overlay">
        <h2 id="status-text">Loading Neural Web Models...</h2>
        <button id="start-btn" onclick="startCalibration()" disabled>Start Calibration</button>
    </div>

    <!-- Link to Separate Tracker Application Logic -->
    <script src="assets/js/app.js?v=exact_match"></script>

</body>
</html>
