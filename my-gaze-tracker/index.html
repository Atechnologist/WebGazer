<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobile Gaze Tracker - Fixed Static Rollback</title>
    
    <!-- Stable Legacy TensorFlow & FaceMesh CDN Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/facemesh"></script>

    <link rel="stylesheet" href="assets/css/style.css?v=exact_match">
    <link rel="icon" href="data:,">

    
</head>
<body>

    <div id="debug-console">System Log: Downloading core engine structures...</div>
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="heatmap-canvas"></canvas>
    <div id="calib-dot" class="calib-dot"></div>
    <div id="gaze-pointer"></div>

    <div class="control-group">
        <div id="relay-button-target">RELAY SWITCH [0%]</div>
        <button id="settings-btn" onclick="toggleSettings()">⚙️ Settings</button>
    </div>

    <div id="settings-panel">
        <div class="control-group">
            <label>Smoothing (Jitter Fix)</label>
            <input type="range" id="smooth-range" min="1" max="25" value="6" oninput="updateSettings()">
            <span id="smooth-val">6 frames</span>
        </div>
        <div class="control-group">
            <label>X-Axis Inversion</label>
            <input type="checkbox" id="invert-x-check" onchange="updateSettings()"> Invert Horizontal Map
        </div>
        <div class="control-group">
            <button onclick="clearHeatmap()" style="width:100%; background:#ff3366; color:white; margin-bottom:15px;">Clear Heatmap</button>
        </div>
        <div id="ble-control-panel" style="position: fixed; top: 20px; right: 20px; z-index: 9999; background: rgba(0,0,0,0.8); padding: 10px 15px; border-radius: 8px; color: #fff; font-family: sans-serif;">
            <button id="bleConnectBtn" onclick="connectBLE()" style="background: #007aff; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold;">
            Pair Atom Lite (BLE)
            </button>
            <div id="connectionStatus" style="font-size: 12px; margin-top: 6px; color: #aaa;">Status: Disconnected</div>
        </div>
    </div>

    <div id="ui-overlay">
        <h2 id="status-text">Loading Neural Web Models...</h2>
        <button id="start-btn" onclick="startCalibration(event)" disabled>Start Calibration</button>
    </div>

    <script src="assets/js/app.js?v=exact_match"></script>
</body>
</html>
