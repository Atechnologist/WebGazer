<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobile Gaze Tracker - BLE Relay Integrated</title>
    
    <!-- Stable Legacy TensorFlow & FaceMesh CDN Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/facemesh"></script>

    <link rel="stylesheet" href="assets/css/style.css?v=exact_match">
    <link rel="icon" href="data:,">
</head>
<body>

    <!-- Core UI Overlay for Startup and Calibration Prompt -->
    <div id="ui-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-family: sans-serif; text-align: center; padding: 20px;">
        <h2 id="status-text" style="margin-bottom: 15px;">Loading core engine structures...</h2>
        <button id="start-btn" disabled onclick="startCalibration(event)" style="padding: 12px 24px; font-size: 16px; background: #2ed573; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Start Calibration</button>
    </div>

    <div id="debug-console" style="position: fixed; top: 10px; left: 10px; font-size: 11px; color: #00ffcc; z-index: 999; pointer-events: none;">System Log: Downloading core engine structures...</div>
    <video id="webcam" autoplay playsinline muted style="display:none;"></video>
    <canvas id="heatmap-canvas" style="position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1;"></canvas>
    <div id="calib-dot" class="calib-dot" style="position: fixed; width: 30px; height: 30px; background: #ff4757; border-radius: 50%; transform: translate(-50%, -50%); display: none; z-index: 10001; pointer-events: none; border: 3px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5);"></div>
    <div id="gaze-pointer" style="position: fixed; width: 20px; height: 20px; background: rgba(0, 255, 128, 0.7); border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); display: none; z-index: 9999; pointer-events: none;"></div>

    <div style="position: fixed; top: 20px; left: 20px; z-index: 999;">
        <button id="settings-btn" onclick="toggleSettings()" style="padding: 10px 15px; background: #444; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">⚙️ Settings</button>
    </div>

    <div id="settings-panel" style="display: none; position: fixed; top: 70px; left: 20px; background: rgba(0,0,0,0.9); padding: 20px; border-radius: 8px; z-index: 1000; color: white; font-family: sans-serif; width: 300px;">
        <div class="control-group" style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Smoothing (Jitter Fix)</label>
            <input type="range" id="smooth-range" min="1" max="25" value="6" oninput="updateSettings()" style="width: 100%;">
            <span id="smooth-val" style="font-size: 12px; color: #aaa;">6 frames</span>
        </div>
        <div class="control-group" style="margin-bottom: 15px;">
            <label><input type="checkbox" id="invert-x-check" onchange="updateSettings()"> Invert Horizontal Map</label>
        </div>
        <div class="control-group">
            <button onclick="clearHeatmap()" style="width:100%; background:#ff3366; color:white; border:none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom:5px;">Clear Heatmap</button>
        </div>
    </div>

    <div id="ble-control-panel" style="position: fixed; top: 20px; right: 20px; z-index: 9999; background: rgba(0,0,0,0.8); padding: 10px 15px; border-radius: 8px; color: #fff; font-family: sans-serif;">
        <button id="bleConnectBtn" onclick="connectBLE()" style="background: #007aff; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold;">
        Pair Atom Lite (BLE)
        </button>
        <div id="connectionStatus" style="font-size: 12px; margin-top: 6px; color: #aaa;">Status: Disconnected</div>
    </div>

    <!-- Side-by-Side Sweet-Spot Comparison Layout (Anchored in the middle horizontal corridor) -->
    <div id="gaze-comparison-container" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 50px; align-items: center; z-index: 9999; font-family: sans-serif;">
        
        <!-- 1. Fixed Target Test Element -->
        <div style="text-align: center;">
            <button id="test-fixed-btn" style="width: 110px; height: 110px; background: #333; color: white; border: 3px solid #555; border-radius: 50%; cursor: pointer; font-weight: bold; transition: background 0.1s; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
                FIXED [0%]
            </button>
            <div id="diagnostic-status" style="color: #aaa; font-size: 11px; margin-top: 8px;">Fixed Sweet Spot</div>
        </div>

        <!-- 2. Sliding Assistive Relay Target Element -->
        <div style="text-align: center;">
            <div id="relay-button-target" onclick="triggerRelayCommand()" style="width: 130px; height: 130px; background: #d9534f; color: white; border: 3px solid #00ffcc; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; text-align: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,255,204,0.3); position: relative;">
                RELAY SWITCH [0%]
            </div>
            <div style="color: #00ffcc; font-size: 11px; margin-top: 8px;">Sliding Assistive</div>
        </div>

    </div>

    <!-- Web Bluetooth Integration Script -->
    <script>
        const SERVICE_UUID = "12345678-1234-1234-1234-1234567890ab";
        const CHAR_UUID = "87654321-4321-4321-4321-ba9876543210";
        let bleCharacteristic = null;

        async function connectBLE() {
            try {
                document.getElementById('connectionStatus').innerText = "Status: Connecting...";
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHAR_UUID);

                document.getElementById('connectionStatus').innerText = "Status: Connected ✅";
                document.getElementById('bleConnectBtn').style.background = "#2ed573";
                document.getElementById('bleConnectBtn').innerText = "Connected (BLE)";
            } catch (error) {
                console.error(error);
                document.getElementById('connectionStatus').innerText = "Status: Error - " + error.message;
            }
        }

        async function triggerRelayCommand() {
            if (!bleCharacteristic) {
                alert("Please pair the Atom Lite via BLE first using the button in the top right.");
                await connectBLE();
                return;
            }
            try {
                const encoder = new TextEncoder();
                await bleCharacteristic.writeValue(encoder.encode("RELAY_TOGGLE"));
                const target = document.getElementById('relay-button-target');
                target.style.background = "#2ed573";
                target.innerText = "💥 RELAY ACTIVE!";
                setTimeout(() => {
                    target.style.background = "#d9534f";
                    target.innerText = "RELAY SWITCH [0%]";
                }, 1500);
            } catch (error) {
                console.error("BLE Write failed, reconnecting...", error);
                bleCharacteristic = null;
                document.getElementById('connectionStatus').innerText = "Status: Disconnected (Reconnection needed)";
            }
        }
    </script>

    <script src="assets/js/app.js?v=exact_match"></script>
</body>
</html>
