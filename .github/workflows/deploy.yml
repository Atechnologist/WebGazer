jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Materialize worker scripts
        run: |
          if [ -L www/worker_scripts ]; then
            rm www/worker_scripts
          fi

          mkdir -p www/worker_scripts
          cp -R src/worker_scripts/. www/worker_scripts/

      - name: Verify Pages output
        run: |
          test -f www/index.html
          test -f www/webgazer.js
          test -f www/worker_scripts/util.js
          test -f www/worker_scripts/mat.js

          if find www -type l -print -quit | grep -q .; then
            echo "Error: symbolic links remain in the Pages artifact"
            find www -type l -ls
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www
