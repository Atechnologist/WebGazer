name: Compile WebGazer and Deploy Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up NodeJS Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install filemanager-webpack-plugin@3.0.0 --save-dev
          npm install

      - name: Compile WebGazer assets
        run: npm run build

      - name: Isolate and Package Web Assets
        run: |
          # 1. Create clean production staging structure folders
          mkdir -p _site
          mkdir -p _site/dist
          mkdir -p _site/assets/css
          mkdir -p _site/assets/js

          # 2. FIX: Move ALL files from the compilation target folder (including WASM binaries/data assets)
          if [ -d "build" ]; then
            cp -r build/* _site/dist/
            echo "Copied entire build/ asset tree completely."
          elif [ -d "dist" ]; then
            cp -r dist/* _site/dist/
            echo "Copied entire dist/ asset tree completely."
          else
            echo "ERROR: No compiled directories found!"
            exit 1
          fi

          # 3. Copy your personal UI configurations into place
          cp index.html _site/
          if [ -d "assets/css" ] && [ "$(ls -A assets/css)" ]; then cp -r assets/css/* _site/assets/css/; fi
          if [ -d "assets/js" ] && [ "$(ls -A assets/js)" ]; then cp -r assets/js/* _site/assets/js/; fi

          # 4. Debug output tree checking
          echo "=== PRODUCTION SITE CONTENTS ==="
          ls -R _site


          # 3. Copy your custom layout files into the isolated staging area
          cp index.html _site/
          if [ -d "assets/css" ] && [ "$(ls -A assets/css)" ]; then cp -r assets/css/* _site/assets/css/; fi
          if [ -d "assets/js" ] && [ "$(ls -A assets/js)" ]; then cp -r assets/js/* _site/assets/js/; fi

          # 4. Explicit verification listing so you can check the logs
          echo "=== PRODUCTION SITE CONTENTS ==="
          ls -R _site

      - name: Upload Static Website Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # Pointing directly to our clean folder bypasses node_modules conflicts entirely
          path: '_site'

  deploy-to-pages:
    needs: build-and-compile
    runs-on: ubuntu-latest
    
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to Live Web URL
        id: deployment
        uses: actions/deploy-pages@v4
