name: Deploy Native Tracker to Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-to-pages:
    runs-on: ubuntu-latest
    
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Download Local Core AI Engine Assets
        run: |
          mkdir -p _site/assets/js
          
          echo "=== TRYING ROUTE 1: GOOGLE PRODUCTION SERVERS ==="
          curl -L --connect-timeout 15 --retry 3 "https://googleapis.com" -o _site/assets/js/face_mesh.js || {
            echo "Google Main script failed, switching to Route 2 (cdnjs)..."
            curl -L "https://cloudflare.com" -o _site/assets/js/face_mesh.js
          }
          
          # Pull the underlying mathematical binary packages and model weights directly from stable alternatives
          curl -L --connect-timeout 15 --retry 3 "https://googleapis.com" -o _site/assets/js/face_mesh.binarypb || {
            echo "Primary model fetch failed, trying alternate mirror..."
            curl -L "https://unpkg.com" -o _site/assets/js/face_mesh.binarypb
          }

          # Fetch required system helpers directly from high-speed open-source caches
          curl -L "https://unpkg.com" -o _site/assets/js/face_mesh_solution_simd_wasm_bin.js
          curl -L "https://unpkg.com" -o _site/assets/js/face_mesh_solution_wasm_bin.js

      - name: Package Application UI
        run: |
          # Copy your main web interface file right into the isolated distribution folder
          cp index.html _site/
          
          echo "=== VERIFYING NATIVE ASSET INVENTORY ==="
          ls -R _site

      - name: Upload Static Website Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to Live Web URL
        id: deployment
        uses: actions/deploy-pages@v4
