name: Deploy Native Tracker to Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-to-pages:
    runs-on: ubuntu-latest
    
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Download Local Core AI Engine Assets
        run: |
          # 1. Create a secure local production script folder
          mkdir -p _site/assets/js
          
          # 2. Download the exact required tracking framework engine files directly into your repository
          curl -L "https://jsdelivr.net" -o _site/assets/js/face_mesh.js
          curl -L "https://jsdelivr.net" -o _site/assets/js/face_mesh_solution_simd_wasm_bin.js
          curl -L "https://jsdelivr.net" -o _site/assets/js/face_mesh_solution_wasm_bin.js
          curl -L "https://jsdelivr.net" -o _site/assets/js/face_mesh.binarypb

      - name: Package Application UI
        run: |
          # 3. Copy your local interface file right into the production folder setup
          cp index.html _site/
          
          echo "=== VERIFYING NATIVE ASSET INVENTORY ==="
          ls -R _site

      - name: Upload Static Website Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to Live Web URL
        id: deployment
        uses: actions/deploy-pages@v4
