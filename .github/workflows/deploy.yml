name: Deploy Safe Gaze Tracker to Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-to-pages:
    runs-on: ubuntu-latest
    
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Isolate and Package Web Assets
        run: |
          # 1. Create standard production folder trees
          mkdir -p _site
          mkdir -p _site/assets/css
          mkdir -p _site/assets/js

          # 2. FIX: Create the exact nested folder structural path WebGazer's interior code is searching for
          mkdir -p _site/WebGazer/mediapipe/face_mesh

          # 3. Pull validated operational model binaries straight from MediaPipe's server array into your deployment
          curl -L "https://jsdelivr.net" -o _site/WebGazer/mediapipe/face_mesh/face_mesh_solution_packed_assets_loader.js
          curl -L "https://jsdelivr.net" -o _site/WebGazer/mediapipe/face_mesh/face_mesh.binarypb
          curl -L "https://jsdelivr.net" -o _site/WebGazer/mediapipe/face_mesh/face_mesh_solution_simd_wasm_bin.js
          curl -L "https://jsdelivr.net" -o _site/WebGazer/mediapipe/face_mesh/face_mesh_solution_wasm_bin.js

          # 4. Copy your customized tracking application interface files into place
          cp index.html _site/
          if [ -d "assets/css" ] && [ "$(ls -A assets/css)" ]; then cp -r assets/css/* _site/assets/css/; fi
          if [ -d "assets/js" ] && [ "$(ls -A assets/js)" ]; then cp -r assets/js/* _site/assets/js/; fi

          echo "=== PRODUCTION SITE CONTENTS VERIFICATION ==="
          ls -R _site

      - name: Upload Static Website Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to Live Web URL
        id: deployment
        uses: actions/deploy-pages@v4
