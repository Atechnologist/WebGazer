name: Compile WebGazer and Deploy Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build WebGazer
        run: npm run build

      - name: Inject Custom Gaze Tracker
        run: |
          # Overwrite default WebGazer demo output with your custom multi-point tracker code
          cp -r my-gaze-tracker/* www/

      - name: Replace symlinks in Pages artifact
        run: |
          staging_dir="$(mktemp -d)"

          # Safely copy files and dereference symlinks using rsync to prevent broken link crashes
          rsync -avL --safe-links www/ "$staging_dir/" || true

          rm -rf www
          mv "$staging_dir" www

      - name: Verify Pages files
        run: |
          test -f www/index.html
          test -f www/worker_scripts/util.js
          test -f www/worker_scripts/mat.js

          # GitHub Pages artifacts should not contain symlinks
          if find www -type l -print -quit | grep -q .; then
            echo "Error: www contains symlinks:"
            find www -type l -ls
            exit 1
          fi

          # Detect broken links before the upload action runs
          if find -L www -type l -print -quit | grep -q .; then
            echo "Error: www contains broken symlinks:"
            find -L www -type l -ls
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
