name: Deploy Safe Gaze Tracker to Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-to-pages:
    runs-on: ubuntu-latest
    
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Isolate and Package Web Assets
        run: |
          # 1. Create standard production folder trees (No external downloads required!)
          mkdir -p _site
          mkdir -p _site/dist
          mkdir -p _site/assets/css
          mkdir -p _site/assets/js

          # 2. Extract freshly built tracking assets out of local directories
          if [ -d "build" ]; then
            cp -r build/* _site/dist/
            echo "Copied asset files from built project directory."
          elif [ -d "dist" ]; then
            cp -r dist/* _site/dist/
            echo "Copied asset files from local project distribution directory."
          else
            echo "ERROR: Local Webpack compiler failed to output code layers!"
            exit 1
          fi

          # 3. Pull your custom design layers into the clean hosting target workspace
          cp index.html _site/
          if [ -d "assets/css" ] && [ "$(ls -A assets/css)" ]; then cp -r assets/css/* _site/assets/css/; fi
          if [ -d "assets/js" ] && [ "$(ls -A assets/js)" ]; then cp -r assets/js/* _site/assets/js/; fi

          # 4. Print map layout for checking step logs
          echo "=== PRODUCTION ARCHIVE LAYOUT ==="
          ls -R _site


      - name: Upload Static Website Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to Live Web URL
        id: deployment
        uses: actions/deploy-pages@v4
