name: Deploy WebGazer Custom Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  package-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Isolate and Package Web Assets
        run: |
          # 1. Create standard staging target production trees
          mkdir -p _site
          mkdir -p _site/dist
          mkdir -p _site/assets/css
          mkdir -p _site/assets/js

          # 2. Secure WebGazer's official pre-compiled engine bundle file directly 
          # This replaces manual Webpack compilation with the tested, stable framework binary
          curl -L "https://webgazer.cs.brown.edu/webgazer.js" -o _site/dist/webgazer.js

          # 3. Pull your custom interface layers into the clean deployment folder
          if [ -f "index.html" ]; then cp index.html _site/; fi
          if [ -d "assets/css" ] && [ "$(ls -A assets/css)" ]; then cp -r assets/css/* _site/assets/css/; fi
          if [ -d "assets/js" ] && [ "$(ls -A assets/js)" ]; then cp -r assets/js/* _site/assets/js/; fi

          # 4. Create an empty file to explicitly prevent GitHub Pages from running Jekyll transformations
          touch _site/.nojekyll

          # 5. Output structure maps for verification
          echo "=== PRODUCTION SITE CONTENTS ==="
          ls -R _site

      - name: Upload Static Website Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy-to-pages:
    needs: package-and-deploy
    runs-on: ubuntu-latest
    
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to Live Web URL
        id: deployment
        uses: actions/deploy-pages@v4
        
